<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Búsqueda con Lupa</title>
  <style>
    .search-container {
      position: relative;
      width: 300px;
      margin: 50px auto;
    }

    .search-container input[type="text"] {
      width: 100%;
      padding: 10px 40px 10px 10px;
      font-size: 16px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    .search-container button {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
    }

    .search-container button img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Buscar...">
    <button id="searchBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="Lupa">
    </button>
  </div>

  <script>
    const searchBox = document.getElementById("searchBox");
    const searchBtn = document.getElementById("searchBtn");

    searchBtn.addEventListener("click", () => {
      const query = searchBox.value.trim();
      if(query) {
        alert("Buscando: " + query);
        // Aquí puedes añadir la lógica para buscar en tu web o llamar a una API
      }
    });

    searchBox.addEventListener("keypress", (e) => {
      if(e.key === "Enter") {
        searchBtn.click();
      }
    });
  </script>
<nav>
  <a href="general/lista.html">Lista Essen Alfon</a>
  <a href="contacto.html">Contacto</a>
</nav>
</body>
  
</html>
