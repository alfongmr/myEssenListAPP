<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscador BGG (XML API2)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="container">
    <h1>Buscador BoardGameGeek</h1>
    <p class="muted">
      Fuente: BGG XML API2 (<a href="https://boardgamegeek.com/wiki/page/BGG_XML_API2" target="_blank" rel="noopener">doc</a>)
    </p>
  </header>

  <main class="container">
    <section class="card">
      <form id="searchForm" aria-label="Formulario de búsqueda BGG">
        <div class="grid">
          <div>
            <label for="query">Término de búsqueda</label>
            <input id="query" name="query" type="text" placeholder="Ej: catan" required />
          </div>
          <div>
            <label for="type">Tipo</label>
            <select id="type" name="type">
              <option value="">Todos</option>
              <option value="boardgame">Boardgame</option>
              <option value="boardgameexpansion">Expansion</option>
              <option value="boardgameaccessory">Accessory</option>
              <option value="videogame">Videogame</option>
              <option value="rpgitem">RPG Item</option>
            </select>
          </div>
          <div>
            <label for="exact">Coincidencia exacta</label>
            <input id="exact" name="exact" type="checkbox" />
          </div>
        </div>
        <div class="actions">
          <button type="submit">Buscar</button>
          <button type="button" id="clearBtn" class="secondary">Limpiar</button>
        </div>
      </form>
    </section>

    <section id="status" role="status" class="muted"></section>

    <section id="results" class="grid-cards" aria-live="polite"></section>

    <nav id="pager" class="pager hidden" aria-label="Paginación">
      <button id="prevPage" disabled>Anterior</button>
      <span id="pageInfo"></span>
      <button id="nextPage" disabled>Siguiente</button>
    </nav>
  </main>

  <footer class="container muted">
    <small>
      Datos obtenidos de BGG XML API2. Considera su <em>rate limit</em> (esperas ~5 s si haces múltiples llamadas seguidas). [1](https://boardgamegeek.com/wiki/page/BGG_XML_API2)
    </small>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
