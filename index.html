<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar Juegos de Mesa</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .search-container { position: relative; width: 300px; margin-bottom: 20px; }
    input[type="text"] {
      width: 100%; padding: 10px 40px 10px 10px; font-size: 16px;
      border-radius: 20px; border: 1px solid #ccc;
    }
    button {
      position: absolute; right: 5px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
    }
    button img { width: 20px; height: 20px; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Buscar Juegos de Mesa</h1>

  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Buscar juego...">
    <button id="searchBtn">
      <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" alt="Lupa">
    </button>
  </div>

  <ul id="results"></ul>

  <script>
    const searchBox = document.getElementById("searchBox");
    const searchBtn = document.getElementById("searchBtn");
    const resultsList = document.getElementById("results");

    // Proxy para evitar problemas de CORS (solo para pruebas)
    const proxy = "https://api.allorigins.win/raw?url=";

    function searchGames(query) {
      const url = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
      fetch(proxy + encodeURIComponent(url))
        .then(response => response.text())
        .then(str => {
          const parser = new DOMParser();
          const xml = parser.parseFromString(str, "application/xml");
          const items = xml.getElementsByTagName("item");
          resultsList.innerHTML = "";

          if(items.length === 0) {
            resultsList.innerHTML = "<li>No se encontraron juegos</li>";
          }

          for (let item of items) {
            const name = item.getElementsByTagName("name")[0].getAttribute("value");
            const id = item.getAttribute("id");

            const li = document.createElement("li");
            li.innerHTML = `<a href="https://boardgamegeek.com/boardgame/${id}" target="_blank">${name}</a>`;
            resultsList.appendChild(li);
          }
        })
        .catch(err => console.error("Error al buscar:", err));
    }

    searchBtn.addEventListener("click", () => {
      const query = searchBox.value.trim();
      if(query) searchGames(query);
    });

    searchBox.addEventListener("keypress", e => {
      if(e.key === "Enter") searchBtn.click();
    });
  </script>
  
<nav>
  <a href="general/lista.html">Lista Essen Alfon</a>
  <a href="contacto.html">Contacto</a>
</nav>
</body>
  
</html>
