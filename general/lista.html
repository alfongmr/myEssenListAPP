<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Leer XML desde GitHub</title>
</head>
<body>
  <h1>Juegos</h1>
   <button onclick="window.history.back()" style="
    padding: 10px 20px;
    border-radius: 5px;
    background-color: #3498db;
    color: white;
    border: none;
    cursor: pointer;">
    ← Volver
</button>
  <ul id="listajuegos"></ul>


<script>
    const xmlUrl = "https://alfongmr.github.io/myEssenListAPP/listas/alfonso.xml"; // Cambia esta URL

    fetch(xmlUrl)
      .then(response => response.text())
      .then(str => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(str, "application/xml");
        const juegos = xml.getElementsByTagName("boardgame");

        const lista = document.getElementById("listajuegos");
        for (let juego of juegos) {
          const nombre = juego.getElementsByTagName("name")[0].textContent;
          const editorial = juego.getElementsByTagName("editorial")[0].textContent;
          const price = juego.getElementsByTagName("Price")[0].textContent;

          const li = document.createElement("li");
          li.textContent = `${nombre} (${editorial}) - €${price}`;
          lista.appendChild(li);
        }
      })
      .catch(err => console.error("Error cargando XML:", err));
  </script>
</body>
</html>
